name: "TV Box Remote"
description: "Remote control for Android TV boxes and TVs over authenticated adb: D-pad, Home, Back, volume, sleep and typing, in the sidebar and as an API"
version: "0.3.0"
slug: "tvbox_remote"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 3400
# host network: the box scan needs the real LAN, not the add-on network; the page and API are also on <host>:3400,
# and with the ssl option on https://<host>:3401 (to install it as an app in Chrome)
host_network: true
# read-only: only HA's certificate is read from it
map:
  - ssl:ro
# Home Assistant API: keys for boxes paired in the Android TV Remote integration go out as remote.send_command
homeassistant_api: true
panel_icon: "mdi:remote-tv"
panel_title: "TV Box"
options:
  port: 5555
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  port: port
  ssl: bool
  certfile: str
  keyfile: str
